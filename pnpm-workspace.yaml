allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
# Excalidraw 0.18.1 pins versions with open advisories. sass is a build tool it
# lists by mistake and never loads, and its braces has no fixed release.
overrides:
  "@excalidraw/excalidraw>nanoid": ^3.3.18
  "@excalidraw/excalidraw>sass": "-"
  "@excalidraw/mermaid-to-excalidraw>nanoid": ^5.1.16
  katex: ^0.18.2
  lodash-es: ^4.18.1
